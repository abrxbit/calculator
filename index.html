<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aesthetic 3D Calculator</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {

    --calc-bg-1: #303030;
    --calc-bg-2: #292929;
    --calc-bg-3: #242424;

    --key-bg-1: #313131;
    --key-bg-2: #292929;
    --key-bg-3: #212121;

    --key-border: #111111;

    --key-text: #ff9da5;

    --toggle-bg: #202020;

    --yellow: #ffd84d;

    --display-text: #ffffff;
}


/* =====================================================
   PAGE
===================================================== */

html,
body {
    min-height: 100%;
}

body {

    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    padding: 18px;

    overflow: auto;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 42%,
            #f1faff 0%,
            #e0f1fa 43%,
            #cfe7f3 100%
        );
}


/* =====================================================
   BLUE CIRCLE
===================================================== */

body::before {

    content: "";

    position: fixed;

    width: 470px;
    height: 470px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 25%,
            #22a7eb 0%,
            #0a94dc 37%,
            #087fc4 70%,
            #066fae 100%
        );

    box-shadow:
        0 30px 65px
        rgba(0,105,170,.18),

        0 0 80px
        rgba(0,145,220,.14);

    pointer-events: none;

    z-index: 0;
}


/* =====================================================
   AMBIENT GLOW
===================================================== */

body::after {

    content: "";

    position: fixed;

    width: 570px;
    height: 570px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(20,150,220,.14),
            rgba(20,150,220,.05) 45%,
            transparent 72%
        );

    filter: blur(18px);

    pointer-events: none;

    z-index: 0;
}


/* =====================================================
   CALCULATOR
===================================================== */

.calculator {

    width: min(
        340px,
        calc(100vw - 36px)
    );

    position: relative;

    z-index: 2;

    padding:
        16px
        16px
        20px;

    border-radius: 37px;

    background:
        linear-gradient(
            145deg,
            var(--calc-bg-1),
            var(--calc-bg-2) 45%,
            var(--calc-bg-3)
        );

    border:
        1px solid
        rgba(255,255,255,.06);

    box-shadow:

        0 27px 40px
        rgba(0,0,0,.22),

        0 10px 18px
        rgba(0,0,0,.15),

        inset
        1px 1px 1px
        rgba(255,255,255,.08),

        inset
        -2px -2px 4px
        rgba(0,0,0,.34);

    transition:
        background .65s
        cubic-bezier(.22,.61,.36,1),

        border-color .55s ease,

        box-shadow .65s
        cubic-bezier(.22,.61,.36,1);
}


/* =====================================================
   DISPLAY
===================================================== */

.display {

    height: 155px;

    position: relative;

    padding:
        16px
        25px
        18px;

    overflow: hidden;

    display: flex;
    flex-direction: column;

    border-radius:
        23px
        23px
        9px
        9px;

    background:
        linear-gradient(
            160deg,
            #050505,
            #0b0b0b
        );

    box-shadow:

        inset
        0 3px 8px
        rgba(0,0,0,.95),

        inset
        0 -1px 0
        rgba(255,255,255,.04),

        0 2px 4px
        rgba(0,0,0,.4);
}


/* =====================================================
   THEME ICON WRAPPER
===================================================== */

.theme-icon-wrap {

    width: 28px;
    height: 28px;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* =====================================================
   MOON
===================================================== */

.moon-shape {

    width: 19px;
    height: 19px;

    position: relative;

    border-radius: 50%;

    background:
        var(--yellow);

    box-shadow:

        0 0 6px
        rgba(255,216,77,.28),

        0 0 10px
        rgba(255,216,77,.12);

    transform:
        rotate(-13deg);

    transition:
        opacity .25s ease,
        transform .5s
        cubic-bezier(.34,1.56,.64,1);
}


.moon-shape::after {

    content: "";

    position: absolute;

    width: 13px;
    height: 13px;

    border-radius: 50%;

    background:
        #080808;

    top: -1px;
    left: 8px;
}


/* =====================================================
   SUN
===================================================== */

.sun-shape {

    width: 16px;
    height: 16px;

    position: relative;

    border-radius: 50%;

    background:
        var(--yellow);

    box-shadow:
        0 0 8px
        rgba(255,216,77,.32);

    transition:
        opacity .25s ease,
        transform .55s
        cubic-bezier(.34,1.56,.64,1);
}


.sun-shape::before,
.sun-shape::after {

    content: "";

    width: 25px;
    height: 2px;

    position: absolute;

    left: 50%;
    top: 50%;

    border-radius: 20px;

    background:
        var(--yellow);
}


.sun-shape::before {

    transform:
        translate(-50%,-50%);
}


.sun-shape::after {

    transform:
        translate(-50%,-50%)
        rotate(90deg);
}


.sun-rays {

    width: 25px;
    height: 2px;

    position: absolute;

    left: 50%;
    top: 50%;

    border-radius: 20px;

    background:
        var(--yellow);

    transform:
        translate(-50%,-50%)
        rotate(45deg);
}


.sun-rays::after {

    content: "";

    width: 25px;
    height: 2px;

    position: absolute;

    border-radius: 20px;

    background:
        var(--yellow);

    transform:
        rotate(90deg);
}


/* =====================================================
   DISPLAY CONTENT
===================================================== */

.display-content {

    width: 100%;

    margin-top: auto;

    display: flex;
    flex-direction: column;
    align-items: flex-end;
}


/* =====================================================
   PREVIOUS EQUATION
===================================================== */

.expression-history {

    width: 100%;

    min-height: 21px;

    overflow: hidden;

    white-space: nowrap;

    text-align: right;

    color:
        #969696;

    font-size:
        15px;

    font-weight:
        650;

    letter-spacing:
        -.2px;

    opacity: 0;

    transform:
        translateY(16px)
        scale(.96);

    transform-origin:
        right center;

    transition:
        transform .45s
        cubic-bezier(.22,.61,.36,1),

        opacity .35s ease;
}


.expression-history.show {

    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}


/* =====================================================
   DISPLAY LINE
===================================================== */

.display-line {

    width: 46%;

    height: 2px;

    margin:
        3px
        0
        7px
        auto;

    border-radius:
        50px;

    background:
        #505050;
}


/* =====================================================
   MAIN DISPLAY
===================================================== */

.main-display {

    width: 100%;

    overflow: hidden;

    white-space: nowrap;

    text-align: right;

    color:
        var(--display-text);

    font-size:
        48px;

    font-weight:
        800;

    line-height:
        1;

    letter-spacing:
        -1.8px;

    transform-origin:
        right bottom;

    transition:

        transform .3s
        cubic-bezier(.22,.61,.36,1),

        opacity .25s ease,

        font-size .3s ease;
}


.main-display.expression-mode {

    font-size:
        33px;

    font-weight:
        720;

    letter-spacing:
        -1px;
}


.main-display.result-mode {

    font-size:
        49px;

    font-weight:
        850;

    animation:
        resultAppear
        .45s
        cubic-bezier(.34,1.4,.64,1);
}


@keyframes resultAppear {

    from {

        opacity: 0;

        transform:
            translateY(10px)
            scale(.93);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =====================================================
   MODE ROW
===================================================== */

.mode-row {

    height:
        50px;

    padding-left:
        6px;

    display:
        flex;

    align-items:
        center;

    gap:
        9px;
}


/* =====================================================
   TOGGLE
===================================================== */

.toggle {

    width:
        58px;

    height:
        25px;

    position:
        relative;

    padding:
        0;

    border:
        0;

    border-radius:
        999px;

    outline:
        none;

    cursor:
        pointer;

    background:
        var(--toggle-bg);

    box-shadow:

        inset
        3px 3px 6px
        rgba(0,0,0,.70),

        inset
        -2px -2px 3px
        rgba(255,255,255,.04),

        0 2px 4px
        rgba(0,0,0,.40);

    transition:
        background .5s ease,
        box-shadow .5s ease;
}


.toggle-knob {

    width:
        19px;

    height:
        19px;

    position:
        absolute;

    left:
        4px;

    top:
        3px;

    border-radius:
        50%;

    background:
        linear-gradient(
            145deg,
            #303030,
            #151515
        );

    box-shadow:

        2px 2px 4px
        rgba(0,0,0,.75),

        inset
        1px 1px 1px
        rgba(255,255,255,.10);

    transition:

        left .5s
        cubic-bezier(.34,1.56,.64,1),

        transform .5s
        cubic-bezier(.34,1.56,.64,1),

        background .5s ease,

        box-shadow .5s ease;
}


.toggle-indicator {

    width:
        7px;

    height:
        5px;

    position:
        absolute;

    right:
        8px;

    top:
        10px;

    border-radius:
        20px;

    background:
        #ef9299;

    box-shadow:
        0 0 6px
        rgba(255,140,150,.7);

    transition:
        background .5s ease,
        box-shadow .5s ease;
}


.toggle.active
.toggle-knob {

    left:
        35px;

    transform:
        rotate(360deg);
}


.toggle.active
.toggle-indicator {

    background:
        #5294ff;

    box-shadow:
        0 0 7px
        rgba(82,148,255,.65);
}


/* =====================================================
   MODE LABEL
===================================================== */

.mode-label {

    color:
        #a87479;

    font-size:
        9px;

    font-weight:
        700;

    letter-spacing:
        .1px;

    transition:
        color .5s ease;
}


/* =====================================================
   KEYPAD
===================================================== */

.keypad {

    display:
        grid;

    grid-template-columns:
        repeat(4,1fr);

    row-gap:
        14px;

    column-gap:
        14px;
}


/* =====================================================
   KEYS
===================================================== */

.key {

    width:
        60px;

    height:
        60px;

    justify-self:
        center;

    border-radius:
        50%;

    border:
        1.5px solid
        var(--key-border);

    outline:
        none;

    cursor:
        pointer;

    user-select:
        none;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:

        radial-gradient(

            circle at 35% 27%,

            var(--key-bg-1) 0%,

            var(--key-bg-2) 50%,

            var(--key-bg-3) 100%
        );

    color:
        var(--key-text);

    font-size:
        25px;

    font-weight:
        750;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;

    text-shadow:
        0 0 3px
        rgba(255,157,165,.23);

    box-shadow:

        0
        4px
        4px
        rgba(0,0,0,.32),

        inset
        2px 2px 3px
        rgba(255,255,255,.045),

        inset
        -3px -3px 5px
        rgba(0,0,0,.35),

        0 0 0 1px
        rgba(255,255,255,.025);

    transition:

        color .55s ease,

        background .55s ease,

        border-color .55s ease,

        box-shadow .55s ease,

        text-shadow .55s ease,

        transform .1s ease;
}


/* =====================================================
   HOVER
===================================================== */

@media (hover:hover) {

    .key:hover {

        transform:
            translateY(-1px);
    }
}


/* =====================================================
   BUTTON PRESS
===================================================== */

.key:active,
.key.pressed {

    transform:
        translateY(3px)
        scale(.96);

    transition-duration:
        .07s;

    box-shadow:

        0
        1px
        2px
        rgba(0,0,0,.45),

        inset
        3px
        4px
        7px
        rgba(0,0,0,.45);
}


/* =====================================================
   OPERATION
===================================================== */

.operation {

    font-size:
        28px;

    font-weight:
        700;
}


/* =====================================================
   EQUALS
===================================================== */

.equals {

    color:
        #292929;

    background:

        radial-gradient(

            circle at 34% 25%,

            #ffb2b7,

            #fca0a7 47%,

            #f38d96 100%
        );

    border-color:
        rgba(255,180,185,.4);

    text-shadow:
        none;

    box-shadow:

        0 4px 6px
        rgba(0,0,0,.34),

        0 0 8px
        rgba(255,151,160,.22),

        inset
        2px 2px 4px
        rgba(255,255,255,.42),

        inset
        -3px -3px 5px
        rgba(170,67,76,.23);
}


/* =====================================================
   LIGHT MODE
===================================================== */

body.light-mode {

    --calc-bg-1:
        #ffffff;

    --calc-bg-2:
        #f8f9fb;

    --calc-bg-3:
        #eceef2;

    --key-bg-1:
        #ffffff;

    --key-bg-2:
        #f5f6f8;

    --key-bg-3:
        #e7e9ed;

    --key-border:
        #d8dbe1;

    --key-text:
        #397dff;

    --toggle-bg:
        #dfe4ec;
}


/* =====================================================
   LIGHT CALCULATOR
===================================================== */

body.light-mode
.calculator {

    border-color:
        rgba(255,255,255,.95);

    box-shadow:

        0 26px 40px
        rgba(40,80,110,.19),

        0 8px 18px
        rgba(70,78,95,.10),

        inset
        1px 1px 2px
        rgba(255,255,255,1),

        inset
        -2px -2px 4px
        rgba(160,165,175,.13);
}


/* DISPLAY ALWAYS BLACK */

body.light-mode
.display {

    background:
        linear-gradient(
            160deg,
            #050505,
            #0b0b0b
        );
}


/* =====================================================
   LIGHT KEYS
===================================================== */

body.light-mode
.key {

    text-shadow:
        0 0 3px
        rgba(57,125,255,.10);

    box-shadow:

        0 4px 7px
        rgba(75,86,110,.16),

        inset
        2px 2px 4px
        rgba(255,255,255,.95),

        inset
        -3px -3px 6px
        rgba(138,146,162,.15),

        0 0 0 1px
        rgba(255,255,255,.75);
}


body.light-mode
.key:active,

body.light-mode
.key.pressed {

    box-shadow:

        0 1px 3px
        rgba(70,80,100,.15),

        inset
        4px 5px 8px
        rgba(150,157,170,.19);
}


/* =====================================================
   BLUE EQUALS
===================================================== */

body.light-mode
.equals {

    color:
        white;

    background:

        radial-gradient(

            circle at 35% 25%,

            #69a3ff,

            #4387ff 48%,

            #2e6fe8 100%
        );

    border-color:
        rgba(45,105,220,.35);

    box-shadow:

        0 4px 7px
        rgba(55,100,200,.24),

        0 0 8px
        rgba(60,130,255,.14),

        inset
        2px 2px 4px
        rgba(255,255,255,.35),

        inset
        -3px -3px 5px
        rgba(30,80,180,.18);
}


/* =====================================================
   LIGHT TOGGLE
===================================================== */

body.light-mode
.toggle-knob {

    background:

        linear-gradient(
            145deg,
            #ffffff,
            #e6e8ed
        );

    box-shadow:

        2px 2px 4px
        rgba(80,90,110,.18),

        inset
        1px 1px 2px
        rgba(255,255,255,1);
}


body.light-mode
.mode-label {

    color:
        #397dff;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 380px) {

    body {

        padding:
            12px;
    }


    body::before {

        width:
            390px;

        height:
            390px;
    }


    body::after {

        width:
            450px;

        height:
            450px;
    }


    .calculator {

        width:
            min(
                310px,
                calc(100vw - 24px)
            );

        padding:
            14px
            14px
            18px;
    }


    .display {

        height:
            145px;
    }


    .key {

        width:
            54px;

        height:
            54px;

        font-size:
            23px;
    }


    .operation {

        font-size:
            26px;
    }


    .keypad {

        row-gap:
            12px;

        column-gap:
            10px;
    }


    .main-display {

        font-size:
            44px;
    }


    .main-display.expression-mode {

        font-size:
            30px;
    }


    .main-display.result-mode {

        font-size:
            46px;
    }
}


/* =====================================================
   SHORT SCREEN / LAPTOP
===================================================== */

@media (max-height: 650px) {

    .calculator {

        width:
            min(
                310px,
                calc(100vw - 30px)
            );

        padding:
            13px
            14px
            17px;
    }


    .display {

        height:
            135px;

        padding:
            13px
            22px
            15px;
    }


    .mode-row {

        height:
            43px;
    }


    .keypad {

        row-gap:
            11px;

        column-gap:
            11px;
    }


    .key {

        width:
            53px;

        height:
            53px;

        font-size:
            22px;
    }


    .operation {

        font-size:
            25px;
    }


    .main-display {

        font-size:
            42px;
    }


    .main-display.expression-mode {

        font-size:
            29px;
    }


    .main-display.result-mode {

        font-size:
            44px;
    }


    .expression-history {

        font-size:
            13px;
    }


    body::before {

        width:
            410px;

        height:
            410px;
    }


    body::after {

        width:
            490px;

        height:
            490px;
    }
}

</style>
</head>


<body>


<div class="calculator">


    <!-- DISPLAY -->

    <div class="display">


        <!-- MOON / SUN -->

        <div class="theme-icon-wrap">

            <div
                id="themeIcon"
                class="moon-shape"
            ></div>

        </div>


        <!-- DISPLAY CONTENT -->

        <div class="display-content">


            <div
                id="expressionHistory"
                class="expression-history"
            ></div>


            <div
                class="display-line"
            ></div>


            <div
                id="mainDisplay"
                class="main-display"
            >
                0
            </div>


        </div>

    </div>


    <!-- THEME SWITCH -->

    <div class="mode-row">


        <button
            id="themeToggle"
            class="toggle"
            type="button"
            aria-label="Switch to light mode"
            aria-pressed="false"
        >

            <span
                class="toggle-knob"
            ></span>

            <span
                class="toggle-indicator"
            ></span>

        </button>


        <div
            id="modeLabel"
            class="mode-label"
        >
            Light mode
        </div>


    </div>


    <!-- KEYPAD -->

    <div class="keypad">


        <button
            class="key"
            data-value="1"
        >
            1
        </button>


        <button
            class="key"
            data-value="2"
        >
            2
        </button>


        <button
            class="key"
            data-value="3"
        >
            3
        </button>


        <button
            class="key operation"
            data-value="/"
        >
            ÷
        </button>


        <button
            class="key"
            data-value="4"
        >
            4
        </button>


        <button
            class="key"
            data-value="5"
        >
            5
        </button>


        <button
            class="key"
            data-value="6"
        >
            6
        </button>


        <button
            class="key operation"
            data-value="*"
        >
            ×
        </button>


        <button
            class="key"
            data-value="7"
        >
            7
        </button>


        <button
            class="key"
            data-value="8"
        >
            8
        </button>


        <button
            class="key"
            data-value="9"
        >
            9
        </button>


        <button
            class="key operation"
            data-value="-"
        >
            −
        </button>


        <button
            class="key"
            data-value="0"
        >
            0
        </button>


        <button
            class="key"
            data-value="."
        >
            .
        </button>


        <button
            class="key equals"
            data-value="="
        >
            =
        </button>


        <button
            class="key operation"
            data-value="+"
        >
            +
        </button>


    </div>

</div>


<script>

(() => {


    /* =================================================
       ELEMENTS
    ================================================= */

    const mainDisplay =
        document.getElementById(
            "mainDisplay"
        );


    const expressionHistory =
        document.getElementById(
            "expressionHistory"
        );


    const buttons =
        document.querySelectorAll(
            ".key"
        );


    const themeToggle =
        document.getElementById(
            "themeToggle"
        );


    const themeIcon =
        document.getElementById(
            "themeIcon"
        );


    const modeLabel =
        document.getElementById(
            "modeLabel"
        );


    /* =================================================
       STATE
    ================================================= */

    let expression = "";

    let resultShown = false;

    let lightMode = false;


    /* =================================================
       PRETTY EQUATION
    ================================================= */

    function prettyExpression(value) {

        return value

            .replace(
                /\*/g,
                " × "
            )

            .replace(
                /\//g,
                " ÷ "
            )

            .replace(
                /\+/g,
                " + "
            )

            .replace(
                /-/g,
                " − "
            )

            .replace(
                /\s+/g,
                " "
            )

            .trim();
    }


    /* =================================================
       RESPONSIVE DISPLAY TEXT
    ================================================= */

    function fitDisplay() {


        const length =
            mainDisplay
            .textContent
            .length;


        if (
            mainDisplay
            .classList
            .contains(
                "result-mode"
            )
        ) {


            if (
                length > 12
            ) {

                mainDisplay
                    .style
                    .fontSize =
                    "31px";

            }

            else if (
                length > 9
            ) {

                mainDisplay
                    .style
                    .fontSize =
                    "38px";

            }

            else {

                mainDisplay
                    .style
                    .fontSize =
                    "";
            }


            return;
        }


        if (
            length > 18
        ) {

            mainDisplay
                .style
                .fontSize =
                "22px";
        }

        else if (
            length > 13
        ) {

            mainDisplay
                .style
                .fontSize =
                "27px";
        }

        else {

            mainDisplay
                .style
                .fontSize =
                "";
        }
    }


    /* =================================================
       LIVE EXPRESSION
    ================================================= */

    function showLiveExpression() {


        expressionHistory
            .classList
            .remove(
                "show"
            );


        expressionHistory
            .textContent =
            "";


        mainDisplay
            .classList
            .remove(
                "result-mode"
            );


        mainDisplay
            .classList
            .add(
                "expression-mode"
            );


        mainDisplay
            .style
            .fontSize =
            "";


        mainDisplay
            .style
            .opacity =
            "1";


        mainDisplay
            .style
            .transform =
            "translateY(0) scale(1)";


        if (
            !expression
        ) {


            mainDisplay
                .textContent =
                "0";


            mainDisplay
                .classList
                .remove(
                    "expression-mode"
                );


            fitDisplay();

            return;
        }


        mainDisplay
            .textContent =
            prettyExpression(
                expression
            );


        fitDisplay();
    }


    /* =================================================
       FORMAT RESULT
    ================================================= */

    function formatResult(number) {


        if (
            Number.isInteger(
                number
            )
        ) {

            return String(
                number
            );
        }


        return Number(
            number.toFixed(8)
        )
        .toString();
    }


    /* =================================================
       CALCULATE
    ================================================= */

    function calculate() {


        if (
            !expression
        ) {

            return;
        }


        if (
            /[+\-*/]$/
            .test(
                expression
            )
        ) {

            return;
        }


        try {


            const valid =
                /^[0-9+\-*/.() ]+$/
                .test(
                    expression
                );


            if (
                !valid
            ) {

                throw new Error(
                    "Invalid expression"
                );
            }


            const answer =
                Function(

                    `"use strict";
                    return (${expression})`

                )();


            if (
                !Number.isFinite(
                    answer
                )
            ) {

                throw new Error(
                    "Math error"
                );
            }


            const rounded =
                Math.round(

                    (
                        answer +
                        Number.EPSILON
                    )

                    *
                    100000000

                )

                /
                100000000;


            const finishedExpression =
                prettyExpression(
                    expression
                );


            const resultText =
                formatResult(
                    rounded
                );


            /* animate upward */

            mainDisplay
                .style
                .opacity =
                "0";


            mainDisplay
                .style
                .transform =
                "translateY(-8px) scale(.95)";


            setTimeout(
                () => {


                    expressionHistory
                        .textContent =
                        finishedExpression;


                    expressionHistory
                        .classList
                        .add(
                            "show"
                        );


                    mainDisplay
                        .classList
                        .remove(
                            "expression-mode"
                        );


                    mainDisplay
                        .classList
                        .add(
                            "result-mode"
                        );


                    mainDisplay
                        .textContent =
                        resultText;


                    mainDisplay
                        .style
                        .opacity =
                        "1";


                    mainDisplay
                        .style
                        .transform =
                        "translateY(0) scale(1)";


                    fitDisplay();


                },
                170
            );


            expression =
                resultText;


            resultShown =
                true;


        }

        catch {


            expressionHistory
                .textContent =
                prettyExpression(
                    expression
                );


            expressionHistory
                .classList
                .add(
                    "show"
                );


            mainDisplay
                .classList
                .remove(
                    "expression-mode"
                );


            mainDisplay
                .classList
                .add(
                    "result-mode"
                );


            mainDisplay
                .textContent =
                "Error";


            expression =
                "";


            resultShown =
                true;


            fitDisplay();
        }
    }


    /* =================================================
       INPUT
    ================================================= */

    function inputValue(value) {


        /* EQUAL */

        if (
            value === "="
        ) {

            calculate();

            return;
        }


        /* NUMBER / DECIMAL */

        if (
            /^[0-9.]$/
            .test(
                value
            )
        ) {


            if (
                resultShown
            ) {


                expression =
                    "";


                resultShown =
                    false;


                expressionHistory
                    .classList
                    .remove(
                        "show"
                    );


                expressionHistory
                    .textContent =
                    "";
            }


            if (
                value === "."
            ) {


                const currentNumber =
                    expression
                    .split(
                        /[+\-*/]/
                    )
                    .pop();


                if (
                    currentNumber
                    .includes(".")
                ) {

                    return;
                }


                if (
                    !currentNumber
                ) {

                    expression +=
                        "0";
                }
            }


            expression +=
                value;


            showLiveExpression();

            return;
        }


        /* OPERATORS */

        if (
            /^[+\-*/]$/
            .test(
                value
            )
        ) {


            if (
                !expression
            ) {


                if (
                    value === "-"
                ) {


                    expression =
                        "-";


                    showLiveExpression();
                }


                return;
            }


            if (
                resultShown
            ) {


                resultShown =
                    false;


                expressionHistory
                    .classList
                    .remove(
                        "show"
                    );


                expressionHistory
                    .textContent =
                    "";
            }


            if (
                /[+\-*/]$/
                .test(
                    expression
                )
            ) {


                expression =
                    expression
                    .slice(
                        0,
                        -1
                    );
            }


            expression +=
                value;


            showLiveExpression();
        }
    }


    /* =================================================
       BUTTON EVENTS
    ================================================= */

    buttons
        .forEach(
            button => {


                button
                    .addEventListener(
                        "click",
                        () => {


                            inputValue(
                                button
                                .dataset
                                .value
                            );

                        }
                    );

            }
        );


    /* =================================================
       THEME ICON
    ================================================= */

    function changeThemeIcon() {


        themeIcon
            .style
            .opacity =
            "0";


        themeIcon
            .style
            .transform =
            "rotate(140deg) scale(.45)";


        setTimeout(
            () => {


                if (
                    lightMode
                ) {


                    themeIcon
                        .className =
                        "sun-shape";


                    themeIcon
                        .innerHTML =
                        "";


                    const rays =
                        document
                        .createElement(
                            "span"
                        );


                    rays
                        .className =
                        "sun-rays";


                    themeIcon
                        .appendChild(
                            rays
                        );

                }

                else {


                    themeIcon
                        .className =
                        "moon-shape";


                    themeIcon
                        .innerHTML =
                        "";
                }


                themeIcon
                    .style
                    .opacity =
                    "1";


                themeIcon
                    .style
                    .transform =
                    lightMode

                    ?
                    "rotate(0deg) scale(1)"

                    :
                    "rotate(-13deg) scale(1)";


            },
            220
        );
    }


    /* =================================================
       THEME
    ================================================= */

    function setTheme() {


        document
            .body
            .classList
            .toggle(
                "light-mode",
                lightMode
            );


        themeToggle
            .classList
            .toggle(
                "active",
                lightMode
            );


        themeToggle
            .setAttribute(
                "aria-pressed",
                String(
                    lightMode
                )
            );


        if (
            lightMode
        ) {


            modeLabel
                .textContent =
                "Dark mode";


            themeToggle
                .setAttribute(
                    "aria-label",
                    "Switch to dark mode"
                );

        }

        else {


            modeLabel
                .textContent =
                "Light mode";


            themeToggle
                .setAttribute(
                    "aria-label",
                    "Switch to light mode"
                );
        }


        changeThemeIcon();
    }


    themeToggle
        .addEventListener(
            "click",
            () => {


                lightMode =
                    !lightMode;


                setTheme();

            }
        );


    /* =================================================
       KEYBOARD
    ================================================= */

    document
        .addEventListener(
            "keydown",
            event => {


                const key =
                    event.key;


                if (
                    /^[0-9.]$/
                    .test(
                        key
                    )
                ) {


                    inputValue(
                        key
                    );
                }


                if (
                    [
                        "+",
                        "-",
                        "*",
                        "/"
                    ]
                    .includes(
                        key
                    )
                ) {


                    inputValue(
                        key
                    );
                }


                if (
                    key === "Enter"
                    ||
                    key === "="
                ) {


                    event
                        .preventDefault();


                    inputValue(
                        "="
                    );
                }


                if (
                    key === "Backspace"
                ) {


                    if (
                        resultShown
                    ) {


                        expression =
                            "";


                        resultShown =
                            false;


                        expressionHistory
                            .textContent =
                            "";


                        expressionHistory
                            .classList
                            .remove(
                                "show"
                            );

                    }

                    else {


                        expression =
                            expression
                            .slice(
                                0,
                                -1
                            );
                    }


                    showLiveExpression();
                }


                if (
                    key === "Escape"
                ) {


                    expression =
                        "";


                    resultShown =
                        false;


                    expressionHistory
                        .textContent =
                        "";


                    expressionHistory
                        .classList
                        .remove(
                            "show"
                        );


                    showLiveExpression();
                }


                buttons
                    .forEach(
                        button => {


                            const value =
                                button
                                .dataset
                                .value;


                            const matches =
                                value === key

                                ||

                                (
                                    value === "="
                                    &&
                                    key === "Enter"
                                );


                            if (
                                matches
                            ) {


                                button
                                    .classList
                                    .add(
                                        "pressed"
                                    );


                                setTimeout(
                                    () => {


                                        button
                                            .classList
                                            .remove(
                                                "pressed"
                                            );


                                    },
                                    110
                                );
                            }

                        }
                    );

            }
        );


    /* INITIALIZE */

    showLiveExpression();


})();

</script>
